[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "migratetool"
version = "1.2.4"
description = "migrate: move VMs between two independent OpenStack clouds, iSCSI Cinder -> Ceph RBD"
readme = "README.md"
requires-python = ">=3.10"
# The package itself only needs the standard library. What the convert host runs it with (openstackclient for the
# 'openstack' commands, os-brick + cinderclient + keystoneauth1 + oslo.* for brick, openstacksdk for 'migrate volume')
# is the 'host' extra, the one list of these packages. It is not pinned: the versions come from the upper-constraints
# of the OpenStack release of the destination cloud (DEPLOY.md section 2.1):
#   pip install -c https://releases.openstack.org/constraints/upper/<release> "<checkout>[host]"
dependencies = []

[project.optional-dependencies]
host = [
    "python-openstackclient",
    "openstacksdk",
    "os-brick",
    "python-cinderclient",
    "keystoneauth1",
    "oslo.concurrency",
    "oslo.config",
]

[project.scripts]
migrate = "migratetool.cli:main"

[tool.setuptools]
packages = ["migratetool"]
